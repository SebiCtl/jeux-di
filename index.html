<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0052F5">
<title>JEUX-DI !</title>
<link rel="icon" href="sceau.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JEUX-DI !">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Charte Carasso : Bleu Carasso dominant, encre bleu nuit, accents des palettes d'axes. Montserrat seule. */
  /* Mise en page : une colonne de 560px max ; scène bleue en haut, feuille blanche qui glisse dessus. */
  --bleu:#0052F5; --nuit:#00194A; --blanc:#FFFFFF;
  --brume:#EEF3FF; --trait:#D6DFF5; --sourd:#4E5F88;
  --ambre:#FDB035; --jaune:#FBDB65; --vert:#AAC462; --beige:#D1996A; --turquoise:#24C0B5; --corail:#FE8675;
  --font:"Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bleu);color:var(--nuit);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{font:inherit}
:focus-visible{outline:3px solid var(--ambre);outline-offset:2px}
[hidden]{display:none!important}
svg.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

.view{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}

/* ---------- Avatars : tête détourée sur disque de couleur ---------- */
.av{--s:56px;position:relative;width:var(--s);height:var(--s);flex:none;display:inline-block}
.av::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--disc,var(--bleu));transition:box-shadow .18s}
.av>.clip{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;pointer-events:none}
.av.pop>.clip{top:-28%;border-radius:0 0 999px 999px}
.av.pop img{width:116%;height:auto;left:-8%;top:auto;bottom:0}
.av.anneau::before{box-shadow:0 0 0 4px var(--blanc)}
.initiales{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:calc(var(--s)*.36);color:var(--nuit);letter-spacing:-.02em}

/* ---------- Accueil ---------- */
.scene{position:relative;padding:calc(22px + env(safe-area-inset-top)) 20px 30px;color:var(--blanc);overflow:hidden}
.logo{display:block;width:230px;height:83px;color:var(--blanc);fill:currentColor}
.titre{font-weight:800;font-size:clamp(50px,17vw,92px);line-height:.9;letter-spacing:-.035em;margin-top:34px;white-space:nowrap}
.titre .ex{color:var(--ambre)}
.accroche{font-weight:500;font-size:17px;margin-top:12px;max-width:24ch}
.des{position:absolute;right:12px;top:calc(24px + env(safe-area-inset-top));width:76px;height:70px}
.des svg{position:absolute;width:44px;height:44px}
.des .d1{right:0;top:0;transform:rotate(16deg)}
.des .d2{left:0;bottom:0;transform:rotate(-12deg)}
.des .face{fill:var(--blanc)} .des .d2 .face{fill:var(--ambre)}
.des .pip{fill:var(--bleu)} .des .d2 .pip{fill:var(--nuit)}

.feuille-page{background:var(--blanc);border-radius:28px 28px 0 0;flex:1;padding:24px 16px 8px;display:flex;flex-direction:column;gap:26px}
.rubrique{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rubrique h2{font-size:13px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--bleu);display:flex;align-items:center;gap:8px}
.compte{background:var(--bleu);color:var(--blanc);border-radius:999px;min-width:24px;height:24px;padding:0 7px;font-size:13px;display:inline-grid;place-items:center;letter-spacing:0;font-variant-numeric:tabular-nums}
.lien{color:var(--bleu);font-weight:700;font-size:14px;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
.lien:disabled{color:var(--trait);cursor:default}

.plateau{list-style:none;display:flex;gap:10px;overflow-x:auto;padding:22px 4px 6px;margin:0 -4px;scrollbar-width:none;min-height:110px}
.plateau::-webkit-scrollbar{display:none}
.plateau-vide{flex:1;border:2px dashed var(--trait);border-radius:16px;padding:14px 16px;color:var(--sourd);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.4}
.jeton{display:flex;flex-direction:column;align-items:center;gap:7px;width:66px;animation:entre .28s cubic-bezier(.2,.9,.3,1.3) both}
.jeton .av{--s:54px}
.jeton .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--nuit);color:var(--blanc);display:grid;place-items:center;z-index:3;box-shadow:0 0 0 2px var(--blanc)}
.jeton .x svg{width:12px;height:12px;stroke-width:3.4}
.jeton .nom{font-size:12px;font-weight:700;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes entre{from{opacity:0;transform:scale(.6)}}


.equipe{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 4px;padding-top:16px}
.equipe li{position:relative}
.carte{width:100%;display:flex;flex-direction:column;align-items:center;gap:9px;padding:20px 2px 8px;border-radius:18px;transition:background .15s}
.carte .av{--s:72px;transition:transform .15s}
.carte:active .av{transform:scale(.93)}
.carte .nom{font-size:14px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.carte[aria-pressed="true"]{background:var(--brume)}
.carte[aria-pressed="true"] .av::before{box-shadow:0 0 0 3px var(--blanc),0 0 0 6px var(--bleu)}
.pastille{position:absolute;right:-6px;bottom:-3px;width:28px;height:28px;border-radius:50%;background:var(--blanc);border:2px solid var(--bleu);color:var(--bleu);display:grid;place-items:center;z-index:3}
.pastille svg{width:15px;height:15px;stroke-width:3.4}
.carte[aria-pressed="true"] .pastille{background:var(--bleu);color:var(--blanc)}
.carte .ok{display:none} .carte[aria-pressed="true"] .ok{display:block} .carte[aria-pressed="true"] .add{display:none}
.carte.invite .av::before{background:var(--brume);border:2px dashed var(--bleu)}
.carte.invite .av{display:grid;place-items:center;color:var(--bleu)}
.carte.invite .av svg{position:relative;width:28px;height:28px}
.suppr{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;background:var(--blanc);color:var(--sourd);display:grid;place-items:center;z-index:4;border:1px solid var(--trait)}
.suppr svg{width:12px;height:12px;stroke-width:3}

.barre{position:sticky;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--blanc) 72%,rgba(255,255,255,0));z-index:5}
.cta{width:100%;min-height:56px;border-radius:16px;background:var(--bleu);color:var(--blanc);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 22px -8px rgba(0,82,245,.6);transition:transform .12s,background .2s}
.cta:active{transform:scale(.98)}
.cta:disabled{background:var(--trait);color:var(--sourd);box-shadow:none;cursor:not-allowed}
.secondaire{min-height:52px;border-radius:16px;border:2px solid var(--bleu);color:var(--bleu);font-weight:800;font-size:15px;padding:0 12px}

/* ---------- Partie ---------- */
#v-partie{background:var(--brume)}
.entete{position:sticky;top:0;z-index:6;background:var(--bleu);color:var(--blanc);padding:calc(10px + env(safe-area-inset-top)) 8px 12px;display:flex;align-items:center;gap:6px}
.icone{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--blanc);flex:none}
.icone:disabled{opacity:.35;cursor:default}
.icone:not(:disabled):active{background:rgba(255,255,255,.14)}
.entete-titre{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.sceau{width:38px;height:38px;flex:none;--sceau-fond:var(--blanc);--sceau-c:var(--bleu)}
.entete-titre strong{display:block;font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entete-titre small{display:block;font-size:13px;font-weight:500;opacity:.88}
.reglages{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;padding:14px 14px 12px;flex-wrap:wrap}
.bascule{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;cursor:pointer}
.bascule input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--trait);position:relative;transition:background .2s;flex:none;cursor:pointer}
.bascule input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--blanc);transition:transform .2s;box-shadow:0 1px 3px rgba(0,25,74,.3)}
.bascule input:checked{background:var(--bleu)}
.bascule input:checked::after{transform:translateX(18px)}

.scores{list-style:none;padding:2px 12px 12px;display:flex;flex-direction:column;gap:10px;flex:1}
.ligne{background:var(--blanc);border-radius:18px;padding:12px 10px 12px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 0 var(--trait);transition:box-shadow .25s}
.ligne.tete{box-shadow:0 0 0 2px var(--ambre),0 6px 16px -10px rgba(253,176,53,.9)}
.ligne .av{--s:50px}
.ident{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding-left:4px}
.ident .nom{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ident .rang{font-size:12px;font-weight:500;color:var(--sourd);min-height:15px;display:flex;align-items:center;gap:4px}
.ident .rang svg{width:16px;height:12px}
.btn-pt{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .1s}
.btn-pt:active{transform:scale(.9)}
.moins{border:2px solid var(--trait);color:var(--bleu);background:var(--blanc)}
.plus{background:var(--bleu);color:var(--blanc)}
.btn-pt small{font-size:10px;font-weight:800;margin-top:-6px}
.score{min-width:66px;height:46px;padding:0 6px;border-radius:12px;background:var(--brume);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--nuit);flex:none}
.score.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.2);color:var(--bleu)}}
#v-partie .barre{background:linear-gradient(to top,var(--brume) 72%,rgba(238,243,255,0))}

/* ---------- Feuilles (saisie) ---------- */
.voile{position:fixed;inset:0;background:rgba(0,25,74,.5);display:flex;align-items:flex-end;justify-content:center;z-index:30;animation:fondu .2s}
.tiroir{background:var(--blanc);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:glisse .28s cubic-bezier(.2,.8,.2,1)}
.tiroir-tete{display:flex;align-items:center;gap:12px}
.tiroir-tete .av{--s:48px}
.tiroir h3{font-size:19px;font-weight:800}
.tiroir p{font-size:14px;color:var(--sourd);font-weight:500}
.tiroir input{font-size:34px;font-weight:800;text-align:center;padding:10px;border:2px solid var(--trait);border-radius:16px;color:var(--nuit);width:100%;font-variant-numeric:tabular-nums}
.tiroir input.texte{font-size:20px;text-align:left;font-weight:700;padding:14px}
.tiroir input:focus{outline:none;border-color:var(--bleu)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.liens{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
@keyframes fondu{from{opacity:0}}
@keyframes glisse{from{transform:translateY(100%)}}

/* ---------- Fin de partie ---------- */
#v-fin{background:radial-gradient(90% 46% at 50% 36%,rgba(255,255,255,.2),rgba(255,255,255,0) 70%),var(--bleu);color:var(--blanc);padding-bottom:calc(20px + env(safe-area-inset-bottom));overflow:hidden}
#feux{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#v-fin>:not(canvas){position:relative;z-index:1}
.fin-tete{padding:calc(26px + env(safe-area-inset-top)) 20px 0;text-align:center}
.fin-jeu{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.fin-titre{font-size:clamp(30px,9vw,44px);font-weight:800;line-height:1.05;letter-spacing:-.02em;margin-top:10px;text-wrap:balance}
.podium{display:grid;grid-template-columns:1fr 1.2fr 1fr;align-items:end;gap:6px;padding:62px 12px 0}
.podium.solo{grid-template-columns:1fr 1.2fr 1fr}
.marche{display:flex;flex-direction:column;align-items:center;min-width:0}
.perso{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:12px;position:relative;max-width:100%;animation:surgit .6s cubic-bezier(.2,.9,.3,1.35) both;animation-delay:calc(var(--d) + .45s)}
.marche .av{--s:74px}
.m1 .av{--s:106px}
.m1 .av::after{content:"";position:absolute;inset:-26%;border-radius:50%;background:radial-gradient(circle,rgba(253,176,53,.75),rgba(253,176,53,0) 68%);z-index:-1;animation:halo 2.6s ease-in-out infinite}
.p-nom{font-weight:700;font-size:15px;margin-top:4px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m1 .p-nom{font-size:19px;font-weight:800}
.p-score{font-weight:800;font-size:14px;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.m1 .p-score{background:var(--ambre);color:var(--nuit);font-size:16px}
.bloc{width:100%;border-radius:14px 14px 0 0;background:var(--blanc);color:var(--bleu);display:flex;justify-content:center;padding-top:12px;font-weight:800;font-size:40px;line-height:1;transform-origin:bottom;animation:monte .7s cubic-bezier(.2,.9,.25,1.12) both;animation-delay:var(--d)}
.m1 .bloc{height:136px;background:var(--ambre);color:var(--nuit)}
.m1 .bloc svg{width:52px;height:52px}
.m2 .bloc{height:98px}
.m3 .bloc{height:70px}
.couronne{position:absolute;top:-50px;left:50%;width:64px;height:46px;transform:translateX(-50%) rotate(-9deg);animation:couronne .8s cubic-bezier(.3,1.6,.5,1) both;animation-delay:1.6s;z-index:3;filter:drop-shadow(0 4px 6px rgba(0,25,74,.35))}
.m1 .perso{cursor:pointer}
@keyframes monte{from{transform:scaleY(0)}}
@keyframes surgit{from{opacity:0;transform:translateY(26px) scale(.75)}}
@keyframes couronne{from{opacity:0;transform:translate(-50%,-90px) rotate(-40deg)}}
@keyframes halo{50%{transform:scale(1.12);opacity:.7}}
.reste{margin:22px 12px 0;background:var(--blanc);color:var(--nuit);border-radius:20px;padding:6px 16px;animation:surgit .5s both;animation-delay:2s}
.reste ol{list-style:none}
.reste li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--trait)}
.reste li:first-child{border-top:0}
.r-rang{min-width:34px;font-weight:800;font-size:15px;color:var(--bleu);font-variant-numeric:tabular-nums}
.reste .av{--s:40px}
.r-nom{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-score{font-weight:800;font-variant-numeric:tabular-nums}
.fin-actions{display:grid;gap:10px;padding:22px 12px 0}
.cta.clair{background:var(--blanc);color:var(--bleu);box-shadow:0 10px 24px -10px rgba(0,25,74,.6)}
#v-fin .secondaire{border-color:rgba(255,255,255,.75);color:var(--blanc)}
#v-fin .logo{margin:36px auto 6px}

@media (min-width:600px){
  .feuille-page{border-radius:28px;margin-bottom:0}
  .scene{padding-top:36px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<script>
(() => {
"use strict";
const EQUIPE = [
  ["benoit","Benoît"],["celine","Céline"],["chloe","Chloé"],["guilhem","Guilhem"],["klaus","Klaus"],
  ["louise","Louise"],["margaux","Margaux"],["marina","Marina"],["marion","Marion"],["mathieu","Mathieu"],
  ["mathilde","Mathilde"],["mayte","Mayté"],["nathaniele","Nathanièle"],["nicolas","Nicolas"],["raquel","Raquel"],
  ["sebastien","Sébastien"],["thibault","Thibault"]
];
const DISQUES = ["--turquoise","--ambre","--vert","--corail","--bleu","--jaune","--beige"];
const COULEUR = {
  benoit:"--bleu", celine:"--bleu", klaus:"--ambre", marina:"--ambre",
  guilhem:"--vert", mathilde:"--vert", raquel:"--vert", chloe:"--vert",
  nicolas:"--corail", mayte:"--corail", thibault:"--turquoise", sebastien:"--turquoise",
  nathaniele:"--beige", margaux:"--beige", mathieu:"--beige", louise:"--jaune", marion:"--jaune"
};
const team = EQUIPE.map(([id,nom]) => ({id, nom, img:`img/${id}.webp`, disque:`var(${COULEUR[id]})`}));
const CLE = "jeuxdi-v1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reduit = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

const defaut = () => ({vue:"accueil", choisis:[], scores:{}, basGagne:false, invites:[], historique:[], enCours:false});
let etat = defaut();

const personnes = () => team.concat(etat.invites.map(g => ({...g, disque:`var(${DISQUES[g.c % 7]})`})));
const parId = id => personnes().find(p => p.id === id);
const initiales = n => n.trim().split(/[\s-]+/).filter(Boolean).map(w => w[0]).join("").slice(0,2).toUpperCase();
const pts = n => `${n} ${Math.abs(n) >= 2 ? "pts" : "pt"}`;
const rangTxt = (r, ex) => (r === 1 ? "1er" : r + "e") + (ex ? " ex æquo" : "");
const de = n => /^[aeiouyàâäéèêëîïôöûüœ]/i.test(n) ? "d'" + n : "de " + n;

function avatar(p, opts = {}) {
  const cls = ["av", opts.pop ? "pop" : "", opts.anneau ? "anneau" : ""].join(" ");
  const inner = p.img
    ? `<span class="clip"><img src="${p.img}" alt="" draggable="false" loading="lazy"></span>`
    : `<span class="initiales">${esc(initiales(p.nom))}</span>`;
  return `<span class="${cls}" style="--disc:${p.disque}">${inner}${opts.extra || ""}</span>`;
}
const ico = (id, cls = "") => `<svg class="ico ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;

function sauver() { try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {} }
function charger() { try { const s = localStorage.getItem(CLE); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function vibrer() { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} }

const dateDuJour = () => new Date().toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"});

/* ---------- classement ---------- */
function classement() {
  const sc = id => etat.scores[id] || 0;
  const ids = etat.choisis.slice().sort((a, b) => etat.basGagne ? sc(a) - sc(b) : sc(b) - sc(a));
  const mieux = (a, b) => etat.basGagne ? a < b : a > b;
  return ids.map(id => {
    const s = sc(id);
    const rang = 1 + ids.filter(o => mieux(sc(o), s)).length;
    const ex = ids.filter(o => sc(o) === s).length > 1;
    return {p: parId(id), s, rang, ex};
  });
}

/* ---------- vues ---------- */
function montrer(vue) {
  etat.vue = vue;
  for (const v of ["accueil","partie","fin"]) $("#v-" + v).hidden = v !== vue;
  if (vue !== "fin") Feux.stop();
  window.scrollTo(0, 0);
  if (vue === "accueil") rendreAccueil();
  if (vue === "partie") rendrePartie();
  if (vue === "fin") rendreFin();
  sauver();
}

function rendreAccueil() {
  const j = new Date().getDay();
  $("#accroche").textContent = j === 4 ? "C'est jeudi : on joue !" : "Pas besoin d'attendre jeudi pour jouer.";
  rendreEquipe();
  rendrePlateau();
}

function rendreEquipe() {
  const html = personnes().map(p => {
    const on = etat.choisis.includes(p.id);
    const badge = `<span class="pastille" aria-hidden="true">${ico("i-plus","add")}${ico("i-ok","ok")}</span>`;
    const suppr = p.img ? "" : `<button class="suppr" type="button" data-suppr="${p.id}" aria-label="Supprimer ${esc(p.nom)} de la liste">${ico("i-x")}</button>`;
    return `<li><button class="carte" type="button" data-id="${p.id}" aria-pressed="${on}" aria-label="${esc(p.nom)}">${avatar(p, {pop:true, extra:badge})}<span class="nom">${esc(p.nom)}</span></button>${suppr}</li>`;
  }).join("");
  $("#equipe").innerHTML = html + `<li><button class="carte invite" type="button" id="btn-invite"><span class="av">${ico("i-plus")}</span><span class="nom">Invité·e</span></button></li>`;
}

function rendrePlateau() {
  const n = etat.choisis.length;
  $("#nb").textContent = n;
  $("#vider").disabled = n === 0;
  $("#plateau").innerHTML = n === 0
    ? `<li class="plateau-vide">Touche une personne ci-dessous pour l'ajouter à la partie.</li>`
    : etat.choisis.map(id => {
        const p = parId(id);
        return `<li><button class="jeton" type="button" data-retirer="${id}" aria-label="Retirer ${esc(p.nom)} des participants">${avatar(p, {pop:true, extra:`<span class="x">${ico("i-x")}</span>`})}<span class="nom">${esc(p.nom)}</span></button></li>`;
      }).join("");
  const b = $("#lancer");
  b.disabled = n < 2;
  b.textContent = n < 2 ? "Choisis au moins 2 participants" : `${etat.enCours ? "Reprendre" : "Lancer"} la partie à ${n}`;
}

function basculer(id) {
  const i = etat.choisis.indexOf(id);
  if (i >= 0) etat.choisis.splice(i, 1); else etat.choisis.push(id);
  const carte = document.querySelector(`.carte[data-id="${id}"]`);
  if (carte) carte.setAttribute("aria-pressed", i < 0);
  rendrePlateau();
  if (i < 0) { const pl = $("#plateau"); pl.scrollTo({left: pl.scrollWidth, behavior: reduit() ? "auto" : "smooth"}); }
  vibrer(); sauver();
}

function rendrePartie() {
  $("#p-titre").textContent = "JEUX-DI\u00A0!";
  $("#p-date").textContent = dateDuJour();
  $("#bas-gagne").checked = etat.basGagne;
  $("#scores").innerHTML = etat.choisis.map(id => {
    const p = parId(id), s = etat.scores[id] || 0;
    return `<li class="ligne" data-ligne="${id}">
      ${avatar(p)}
      <span class="ident"><span class="nom">${esc(p.nom)}</span><span class="rang" data-rang></span></span>
      <button class="btn-pt moins" type="button" data-moins="${id}" aria-label="Retirer 1 point à ${esc(p.nom)}">${ico("i-moins")}</button>
      <button class="score" type="button" data-score="${id}" aria-label="Score de ${esc(p.nom)} : ${s}. Saisir des points">${s}</button>
      <button class="btn-pt plus" type="button" data-plus="${id}" aria-label="Ajouter 1 point à ${esc(p.nom)}">${ico("i-plus")}</button>
    </li>`;
  }).join("");
  majRangs();
  majAnnuler();
}

function majRangs() {
  const c = classement();
  const tousEgaux = c.every(x => x.s === c[0].s);
  for (const x of c) {
    const li = document.querySelector(`[data-ligne="${x.p.id}"]`);
    if (!li) continue;
    const tete = !tousEgaux && x.rang === 1;
    li.classList.toggle("tete", tete);
    li.querySelector("[data-rang]").innerHTML = tousEgaux ? "" :
      (tete ? `<svg aria-hidden="true" viewBox="0 0 64 46"><use href="#i-couronne"/></svg>` : "") + esc(rangTxt(x.rang, x.ex)) + (tete && !x.ex ? " · en tête" : "");
  }
}
function majAnnuler() { $("#annuler").disabled = etat.historique.length === 0; }

function majScore(id) {
  const b = document.querySelector(`[data-score="${id}"]`);
  if (!b) return;
  const s = etat.scores[id] || 0, p = parId(id);
  b.textContent = s;
  b.setAttribute("aria-label", `Score de ${p.nom} : ${s}. Saisir des points`);
  b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump");
}

function fixer(id, valeur) {
  const avant = etat.scores[id] || 0;
  if (valeur === avant) return;
  etat.historique.push([id, avant]);
  if (etat.historique.length > 300) etat.historique.shift();
  etat.scores[id] = valeur;
  majScore(id); majRangs(); majAnnuler(); vibrer(); sauver();
}
const ajouter = (id, d) => fixer(id, (etat.scores[id] || 0) + d);

/* ---------- fin de partie ---------- */
function rendreFin() {
  const c = classement();
  $("#f-jeu").textContent = "Partie du " + dateDuJour();
  const premiers = c.filter(x => x.rang === 1);
  $("#f-titre").textContent = premiers.length > 1
    ? `Égalité au sommet entre ${premiers.map(x => x.p.nom).join(", ").replace(/, ([^,]*)$/, " et $1")} !`
    : `Victoire ${de(premiers[0].p.nom)} !`;
  const top = c.slice(0, 3);
  const ordre = [[top[1], "m2", .25], [top[0], "m1", .5], [top[2], "m3", 0]];
  $("#podium").innerHTML = ordre.map(([x, m, d]) => {
    if (!x) return `<div class="marche ${m}"></div>`;
    const bloc = m === "m1"
      ? `<div class="bloc" style="--d:${d}s"><svg viewBox="0 0 64 64" aria-label="Trophée, ${esc(rangTxt(x.rang, x.ex))}" role="img"><use href="#i-trophee"/></svg></div>`
      : `<div class="bloc" style="--d:${d}s"><span aria-label="${esc(rangTxt(x.rang, x.ex))}">${x.rang}</span></div>`;
    const couronne = m === "m1" ? `<svg class="couronne" viewBox="0 0 64 46" aria-hidden="true"><use href="#i-couronne"/></svg>` : "";
    return `<div class="marche ${m}">
      <div class="perso" style="--d:${d}s" ${m === "m1" ? 'id="gagnant" title="Encore des feux d\'artifice !"' : ""}>${couronne}${avatar(x.p, {pop:true, anneau:true})}
        <span class="p-nom">${esc(x.p.nom)}</span><span class="p-score">${pts(x.s)}</span></div>
      ${bloc}</div>`;
  }).join("");
  const reste = c.slice(3);
  $("#reste-bloc").hidden = reste.length === 0;
  $("#reste").innerHTML = reste.map(x => `<li><span class="r-rang">${esc(rangTxt(x.rang, false))}</span>${avatar(x.p)}<span class="r-nom">${esc(x.p.nom)}${x.ex ? ' <small style="color:var(--sourd);font-weight:500">ex æquo</small>' : ""}</span><span class="r-score">${pts(x.s)}</span></li>`).join("");
  if (!reduit()) setTimeout(() => { if (etat.vue === "fin") Feux.lancer(5200); }, 1500);
}

/* ---------- feux d'artifice (couleurs des palettes Carasso) ---------- */
const Feux = (() => {
  const COULEURS = ["#FDB035","#FBDB65","#24C0B5","#FE8675","#AAC462","#FFFFFF"];
  let cv, ctx, W = 0, H = 0, raf = 0, jusqua = 0, dernier = 0, prec = 0, parts = [], fusees = [];
  const G = 0.16;
  function taille() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function eclat(x, y) {
    const c = COULEURS[Math.random() * COULEURS.length | 0];
    const n = 60 + (Math.random() * 40 | 0), v = 3.4 + Math.random() * 1.8;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = Math.sqrt(Math.random()) * v;
      parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, vie: 1, d: .009 + Math.random() * .012, c: Math.random() < .2 ? "#FFFFFF" : c});
    }
  }
  function fusee() {
    const x = W * (.12 + Math.random() * .76), cible = H * (.1 + Math.random() * .32);
    fusees.push({x, y: H + 8, vx: (Math.random() - .5) * 1.4, vy: -Math.sqrt(2 * G * (H + 8 - cible)), c: COULEURS[Math.random() * COULEURS.length | 0]});
  }
  function image(t) {
    const k = Math.min(3, (t - (prec || t)) / 16.67 || 1); prec = t;
    ctx.clearRect(0, 0, W, H);
    if (t < jusqua && t - dernier > 380 + Math.random() * 260) { fusee(); dernier = t; }
    ctx.lineCap = "round";
    for (let i = fusees.length - 1; i >= 0; i--) {
      const f = fusees[i], px = f.x, py = f.y;
      f.vy += G * k; f.x += f.vx * k; f.y += f.vy * k;
      ctx.globalAlpha = .9; ctx.strokeStyle = f.c; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(px - f.vx * 3, py - f.vy * 3); ctx.lineTo(f.x, f.y); ctx.stroke();
      if (f.vy >= -0.5) { eclat(f.x, f.y); fusees.splice(i, 1); }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.vx *= Math.pow(.975, k); p.vy = p.vy * Math.pow(.975, k) + .05 * k;
      p.x += p.vx * k; p.y += p.vy * k; p.vie -= p.d * k;
      if (p.vie <= 0) { parts.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, p.vie * 1.4); ctx.strokeStyle = p.c; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(p.x - p.vx * 2.6, p.y - p.vy * 2.6); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (t >= jusqua && !parts.length && !fusees.length) { raf = 0; prec = 0; ctx.clearRect(0, 0, W, H); return; }
    raf = requestAnimationFrame(image);
  }
  return {
    lancer(ms) {
      cv = cv || $("#feux"); ctx = ctx || cv.getContext("2d");
      taille();
      jusqua = performance.now() + ms;
      const g = $("#gagnant");
      if (g) { const r = g.getBoundingClientRect(); eclat(r.left + r.width / 2, Math.max(60, r.top - 20)); }
      setTimeout(() => eclat(W * .22, H * .2), 250);
      setTimeout(() => eclat(W * .78, H * .24), 500);
      if (!raf) raf = requestAnimationFrame(image);
    },
    stop() { if (raf) cancelAnimationFrame(raf); raf = 0; prec = 0; parts = []; fusees = []; if (ctx) ctx.clearRect(0, 0, W, H); },
    taille() { if (raf) taille(); }
  };
})();
addEventListener("resize", () => Feux.taille());

/* ---------- tiroirs ---------- */
let cible = null;
function ouvrir(el, focus) { el.hidden = false; setTimeout(() => focus && focus.focus(), 60); }
function fermer() { document.querySelectorAll(".voile").forEach(v => v.hidden = true); cible = null; }
function ouvrirPoints(id) {
  cible = id; const p = parId(id);
  $("#tp-av").innerHTML = avatar(p);
  $("#tp-titre").textContent = "Points pour " + p.nom;
  $("#tp-actuel").textContent = "Score actuel : " + (etat.scores[id] || 0);
  $("#tp-val").value = "";
  ouvrir($("#t-points"), $("#tp-val"));
}
const valeurSaisie = () => { const v = parseInt($("#tp-val").value.replace(/[^\d-]/g, ""), 10); return Number.isFinite(v) ? v : null; };

/* ---------- événements ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button, .voile, #gagnant");
  if (!t) return;
  if (t.classList.contains("voile")) { if (e.target === t) fermer(); return; }
  if (t.id === "gagnant") { if (!reduit()) Feux.lancer(2600); return; }
  const d = t.dataset;
  if (d.fermer !== undefined) return fermer();
  if (t.id === "btn-invite") { $("#ti-nom").value = ""; return ouvrir($("#t-invite"), $("#ti-nom")); }
  if (d.suppr) {
    etat.invites = etat.invites.filter(g => g.id !== d.suppr);
    etat.choisis = etat.choisis.filter(x => x !== d.suppr);
    delete etat.scores[d.suppr];
    rendreEquipe(); rendrePlateau(); return sauver();
  }
  if (d.id) return basculer(d.id);
  if (d.retirer) return basculer(d.retirer);
  if (d.plus) return ajouter(d.plus, 1);
  if (d.moins) return ajouter(d.moins, -1);
  if (d.score) return ouvrirPoints(d.score);
  switch (t.id) {
    case "vider": etat.choisis = []; rendreEquipe(); rendrePlateau(); return sauver();
    case "lancer":
      if (etat.choisis.length < 2) return;
      etat.choisis.forEach(id => { if (!(id in etat.scores)) etat.scores[id] = 0; });
      etat.enCours = true; return montrer("partie");
    case "retour": return montrer("accueil");
    case "annuler": {
      const h = etat.historique.pop(); if (!h) return;
      etat.scores[h[0]] = h[1];
      if (etat.choisis.includes(h[0])) { majScore(h[0]); majRangs(); }
      majAnnuler(); return sauver();
    }
    case "fin": return montrer("fin");
    case "revanche": etat.scores = {}; etat.choisis.forEach(id => etat.scores[id] = 0); etat.historique = []; return montrer("partie");
    case "reprendre": return montrer("partie");
    case "nouvelle": etat.scores = {}; etat.historique = []; etat.enCours = false; return montrer("accueil");
    case "tp-plus": case "tp-moins": case "tp-fixer": {
      const v = valeurSaisie(); if (v === null || cible === null) { $("#tp-val").focus(); return; }
      if (t.id === "tp-fixer") fixer(cible, v); else ajouter(cible, t.id === "tp-plus" ? v : -v);
      return fermer();
    }
  }
});
$("#tp-val").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#tp-plus").click(); } });
$("#ti-form").addEventListener("submit", e => {
  e.preventDefault();
  const nom = $("#ti-nom").value.trim().replace(/\s+/g, " ");
  if (!nom) return $("#ti-nom").focus();
  const id = "g" + Date.now().toString(36);
  etat.invites.push({id, nom, c: etat.invites.length + 2});
  etat.choisis.push(id);
  fermer(); rendreEquipe(); rendrePlateau(); sauver();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") fermer(); });
$("#bas-gagne").addEventListener("change", e => { etat.basGagne = e.target.checked; majRangs(); sauver(); });

/* ---------- démarrage ---------- */
function demarrer(data) {
  const src = data && data.vue ? data : charger();
  etat = Object.assign(defaut(), src || {});
  etat.choisis = etat.choisis.filter(id => parId(id));
  if (etat.vue !== "accueil" && etat.choisis.length < 2) etat.vue = "accueil";
  montrer(etat.vue);
}
window.claude?.hot?.snapshot?.(() => etat);
window.claude?.hot?.ready ? window.claude.hot.ready(demarrer) : demarrer(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
